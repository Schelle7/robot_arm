model_path: models/so101/scene.xml
backend: sim
seed: 0
conversion:
  min_gripped_seconds: 2.0
hardware:
  port: /dev/ttyACM0
  calibration_id: my_follower
  read_timeout_margin_ms: 5.0
camera:
  jpeg_quality: 90
  cameras:
    external_camera:
      mujoco_name: pixel_cam
      height: 480
      width: 640
    wrist_camera:
      mujoco_name: wrist_cam
      height: 360
      width: 640
control:
  frequencies:
    cartesian: 5
    joint: 20
    mujoco: 200
  max_seconds: 30
  duty_compensation_enabled: false
  grasp_estimation:
    position_range_radians:
    - 0.3
    - 0.5
    max_box_distance_meters: 0.04
    min_closing_duty: 0.1
    max_velocity_radians_per_second: 0.05
    hold_seconds: 0.2
  joint_velocity_scale_radians_per_second: 1.5708
  policy_history_seconds: 0.5
  initial_joints:
    mode: random_range
    range_percent:
    - 45.0
    - 55.0
    positions_radians:
      shoulder_pan: 0.0
      shoulder_lift: 0.0
      elbow_flex: 0.0
      wrist_flex: 0.0
      wrist_roll: 0.0
      gripper: 0.0
  staging:
    enabled: false
    speed_radians_per_second: 2.6
    tolerance_radians: 0.03
    max_seconds: 12.0
policy:
  history_encoder:
  - 256
  - 128
  state_encoder:
  - 128
  - 128
  goal_encoder:
  - 64
  - 64
  fusion:
  - 256
  - 256
  forward_head:
  - 128
reward:
  pose_weights:
    position: 1.0
    rotation_primary: 1.0
    rotation_secondary: 0.5
    gripper: 1.0
    gripper_duty: 1.0
  tracking:
    progress: true
    deviation: false
  joint_limit_penalty: true
  termination_penalty: true
  sustained_duty_penalty: true
  idle_action_penalty: true
  action_change_penalty: true
  joint_limit_penalty_factor: 1.0
  idle_action_threshold: 0.2
  idle_action_penalty_factor: 5
  action_change_penalty_factor: 0.3
  sustained_duty_allowance: 1.0
  sustained_duty_penalty_factor: 1.0
runtime:
  draw_waypoints: true
  draw_tcp: true
  disable_box_collisions: false
  record_sim_state: true
  record_policy_debug: false
  capture_camera: false
safety:
  max_temperature_celsius: 45.0
  duty_ema_seconds: 1.0
  max_smoothed_duty: 1
servo:
  ticks_per_revolution: 4096
  full_scale_duty: 1000
  dead_zone_ticks: 1
  min_startup_duty: 16
  max_duty:
    shoulder_pan: 1000
    shoulder_lift: 1000
    elbow_flex: 1000
    wrist_flex: 1000
    wrist_roll: 1000
    gripper: 500
  duty_per_tick: 4.6
  stall_torque_newton_meters: 1.31
  no_load_speed_radians_per_second: 3.3
  physics_randomization:
    damping:
    - 0.04
    - 0.15
    frictionloss:
    - 0.015
    - 0.06
    armature:
    - 0.008
    - 0.03
    added_weight:
      box_mass_fraction:
      - 0.0
      - 1.3
scene:
  object_placement:
    shoulder_distance_meters:
    - 0.25
    - 0.35
    base_rotation_degrees:
    - -50.0
    - 50.0
    min_separation_meters: 0.1
training:
  num_workers: 10
  detailed_metrics: true
  pose_delta_diagnostics_enabled: true
  sync_weights_every_n_cartesian_actions: 1
  broadcast_weights_every_n_steps: 1000
  total_training_steps: 1000000
  learning_rate: 0.0003
  actor_forward_loss_weight: 0.1
  critic_forward_loss_weight: 0.1
  buffer_size: 100000
  learning_starts: 5000
  batch_size: 1024
  gamma: 1.0
  terminate_at_cartesian_action_end: true
  tau: 0.005
  train_freq: 10
  gradient_steps: 10
  save_episodes_freq: 20
  checkpoint_every_n_steps: 10000
  worker_check_seconds: 30
  gpu_sample_seconds: 3
waypoint:
  cartesian_action_dim: 7
  duty_completion_tolerance: 0.1
  position_speed_meters_per_second: 0.05
  rotation_speed_radians_per_second: 0.2
  gripper_speed_radians_per_second: 0.5
  primitive_probabilities:
    pick_and_place: 0.5
    relative_move: 0.0
    random_waypoint: 0.5
  completion_tolerance:
    position_meters: 0.01
    primary_rotation_radians: 0.1
    secondary_rotation_radians: 0.12
    gripper_radians: 0.1
  random_pose:
    gripper_radians:
    - 0.0
    - 1.7453292
    shoulder_distance_meters:
    - 0.3
    - 0.45
    base_rotation_degrees:
    - -90.0
    - 90.0
    height_meters:
    - 0.1
    - 0.4
    pointing_axis_tilt_degrees:
    - -10.0
    - 45.0
    pointing_axis_rotation_degrees:
    - -150.0
    - 150.0
  pick_and_place:
    grasp_z_offset_meters: -0.005
    lift_z_offset_meters: 0.08
    gripper_open_radians: 0.8
    gripper_closed_radians: 0.2
    gripper_abort_below_radians: 0.3
    desired_gripper_duty: -0.35
  relative_move:
    dx_range_meters:
    - -0.08
    - 0.08
    dy_range_meters:
    - -0.06
    - 0.06
    dz_range_meters:
    - -0.08
    - 0.08
device: cuda
continue_from: false
