defaults:
  - _self_

hydra:
  run:
    dir: outputs/rollout/${hydra.job.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}

policy_name: latest

control:
  max_seconds: 45
  frequencies:
    cartesian: 5
    joint: 20
    mujoco: 200

safety:
  max_temperature_celsius: 45.0
  duty_ema_seconds: 1
  max_smoothed_duty: 1

runtime:
  disable_box_collisions: false
  record_policy_debug: true
  capture_camera: true
