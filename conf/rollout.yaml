defaults:
  - _self_

hydra:
  run:
    dir: outputs/rollout/${hydra.job.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}

policy_name: latest

control:
  max_seconds: 45
  grasp_estimation:
    position_range_radians: [0.1, 0.7]
    min_closing_duty: 0.1
    max_velocity_radians_per_second: 0.05
    hold_seconds: 0.2
  frequencies:
    cartesian: 5
    joint: 20
    mujoco: 200
  initial_joints:
    mode: random_range
    range_percent: [45.0, 55.0]
    positions_radians:
      shoulder_pan: 0.0
      shoulder_lift: 0.0
      elbow_flex: 0.0
      wrist_flex: 0.0
      wrist_roll: 0.0
      gripper: 0.0

safety:
  max_temperature_celsius: 55.0
  duty_ema_seconds: 1
  max_smoothed_duty: 1

runtime:
  disable_box_collisions: false
  record_policy_debug: true
  capture_camera: true
