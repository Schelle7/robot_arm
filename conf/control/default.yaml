frequencies:
  cartesian: 5
  joint: 20
  mujoco: 200
max_seconds: 30
duty_compensation_enabled: false
grasp_estimation:
  # Initial estimates; calibrate the angle interval against the box in the gripper.
  position_range_radians: [0.3, 0.5]
  max_box_distance_meters: 0.04
  min_closing_duty: 0.1
  max_velocity_radians_per_second: 0.05
  hold_seconds: 0.2
joint_velocity_scale_radians_per_second: 1.5708  # = pi/2 somewhat random
policy_history_seconds: 0.5

initial_joints:
  mode: random_range
  range_percent: [45.0, 55.0]
  positions_radians:
    shoulder_pan: 0.0
    shoulder_lift: 0.0
    elbow_flex: 0.0
    wrist_flex: 0.0
    wrist_roll: 0.0
    gripper: 0.0

staging:
  enabled: true
  speed_radians_per_second: 2.6
  tolerance_radians: 0.03
  max_seconds: 12.0
