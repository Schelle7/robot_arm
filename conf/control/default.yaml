frequencies:
  cartesian: 5
  joint: 20
  mujoco: 200
max_seconds: 15
joint_velocity_scale_radians_per_second: 1.5708  # = pi/2 somewhat random
state_history_seconds: 0.1

# How far back the duty the policy observes reaches. Short on purpose: it is a stand-in for state,
# not a safety signal. How to give the policy proper state and let it act against the control delay
# is still undecided.
duty_history_seconds: 0.1

initial_joints:
  mode: random_range
  range_percent: [45.0, 55.0]
  positions_radians:
    shoulder_pan: 0.0
    shoulder_lift: 0.0
    elbow_flex: 0.0
    wrist_flex: 0.0
    wrist_roll: 0.0
    gripper: 0.0

staging:
  enabled: true
  speed_radians_per_second: 2.6
  tolerance_radians: 0.03
  max_seconds: 12.0
