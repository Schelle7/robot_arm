defaults:
  - rollout
  - _self_

backend: real

runtime:
  draw_waypoints: false
  draw_tcp: false
  record_sim_state: false

# Pinned to a single reachable target: a random one on hardware is a random chance of driving the
# arm somewhere it cannot go. Edit these to move the target.
waypoint:
  primitive_probabilities:
    pick_and_place: 0.0
    relative_move: 0.0
    random_waypoint: 1.0
  random_pose:
    shoulder_distance_meters: [0.32, 0.32]
    base_rotation_degrees: [15.0, 15.0]
    height_meters: [0.30, 0.30]
    pointing_axis_tilt_degrees: [30.0, 30.0]
    pointing_axis_rotation_degrees: [0.0, 0.0]
    gripper_radians: [0.0, 0.0]