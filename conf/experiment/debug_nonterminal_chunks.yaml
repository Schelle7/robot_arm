# @package _global_
# Experimental: tests value bootstrapping across chunks even though the intended objective is isolated chunk improvement.
# This is questionable because gamma and nonterminal chunks can make SAC optimize beyond the chunk-local objective.
device: "cuda"

runtime:
  record_policy_debug: false

control:
  frequencies:
    mid_level: 5
    low_level: 5
  action_scale_radians_per_second: 0.5

waypoint:
  trajectory_length: 1
  position_speed_meters_per_second: 0.05
  rotation_speed_radians_per_second: 0.2
  gripper_speed_radians_per_second: 0.5

training:
  total_training_steps: 240000
  gamma: 0.99
  terminate_at_chunk_end: false