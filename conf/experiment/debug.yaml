# @package _global_
# Four low-level control steps per high-level action, so the low level has room to choose how it
# reaches the one goal the mid level hands it.
device: "cuda"

runtime:
  record_policy_debug: false

reward:
  tracking:
    deviation: false

control:
  frequencies:
    cartesian: 5
    joint: 5
  staging:
    enabled: false

waypoint:
  position_speed_meters_per_second: 0.05
  rotation_speed_radians_per_second: 0.2
  gripper_speed_radians_per_second: 0.5

training:
  total_training_steps: 240000
