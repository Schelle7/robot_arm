defaults:
  - _self_

hydra:
  run:
    dir: outputs/${hydra.job.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}

policy_name: latest
# policy_name: fallback_checkpoint/2026-08-12/12-24-20/checkpoints/sac_manual_step_final_240000.zip
num_episodes: 10

control:
  max_seconds: 45
  frequencies:
    cartesian: 5
    joint: 5
    mujoco: 200

safety:
  max_temperature_celsius: 45.0
  duty_ema_seconds: 0.2
  max_smoothed_duty: 0.6

runtime:
  disable_box_collisions: false
  record_policy_debug: true
  record_sim_state: true
  draw_waypoints: false
  draw_tcp: false
