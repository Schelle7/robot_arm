defaults:
  - _self_

hydra:
  run:
    dir: outputs/${hydra.job.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}

policy_name: latest
# policy_name: outputs/train_joint_policy/YYYY-MM-DD/HH-MM-SS/checkpoints/jax_sac_final_STEPS.actor.npz
num_episodes: 10

control:
  max_seconds: 45
  frequencies:
    cartesian: 5
    joint: 20
    mujoco: 200

safety:
  max_temperature_celsius: 45.0
  duty_ema_seconds: 1
  max_smoothed_duty: 1

runtime:
  capture_camera: true
  disable_box_collisions: false
  record_policy_debug: true
  record_sim_state: true
  draw_waypoints: false
  draw_tcp: false
