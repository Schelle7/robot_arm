defaults:
  - _self_
  - experiment: baseline_cuda

hydra:
  run:
    dir: outputs/${hydra.job.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}

model_path: "models/so101/scene.xml"
# Backend configuration
backend: "sim" # "sim" or "real"
draw_waypoints: true
record_sim_state: true

# Hardware parameters used if backend == "real"
hardware:
  port: "/dev/ttyACM0"
  calibration_id: "my_follower"

max_seconds: 20

# Camera resolution
camera:
  height: 480
  width: 640
  jpeg_quality: 90

# Control frequencies in Hz
frequencies:
  high_level: 5   # VLA inference and camera recording rate
  low_level: 200   # PID/MuJoCo physics stepping rate

# Safety constraints
safety:
  max_position_radians: 3.10
  min_position_radians: -3.10
  violation_penalty_factor: 10.0
  max_temperature_celsius: 45.0
  load_ema_alpha: 0.1
  max_smoothed_load: 0.6
  
# Trajectory parameters
trajectory_length: 50
trajectory_dim: 7
pose_distance_weights: [1.0, 1.0, 1.0, 0.5, 0.5, 0.5, 1.0]

# Training parameters for the low-level SAC controller
training:
  total_training_steps: 30000
  learning_rate: 0.0003
  buffer_size: 100000
  learning_starts: 0
  batch_size: 256
  tau: 0.005
  train_freq: 1
  gradient_steps: 1
  save_episodes_freq: 20

  # Waypoint generation
  lift_height: 0.15
  gripper_open: 1.0
  gripper_closed: 0.0
  waypoint_speed: 0.005
