defaults:
  - _self_
  - camera: default
  - control: default
  - policy: default
  - reward: default
  - runtime: default
  - safety: default
  - servo: default
  - scene: default
  - training: default
  - waypoint: default
  - experiment: default

hydra:
  run:
    dir: outputs/${hydra.job.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}

model_path: "models/so101/scene.xml"
arm_type: "sim" # "sim" or "real"
seed: 0
conversion:
  video_files_size_in_mb: 100

# Hardware parameters used if arm_type == "real"
hardware:
  port: "/dev/ttyACM0"
  calibration_id: "my_follower"
  read_timeout_seconds: 0.01
  max_feedback_age_seconds: 1.0
  read_history_size: 10000
