defaults:
  - _self_
  - camera: default
  - control: default
  - policy: default
  - reward: default
  - runtime: default
  - safety: default
  - servo: default
  - scene: default
  - training: default
  - waypoint: default
  - experiment: default

hydra:
  run:
    dir: outputs/${hydra.job.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}

model_path: "models/so101/scene.xml"
backend: "sim" # "sim" or "real"
seed: 0
conversion:
  min_gripped_seconds: 2.0
  # Force a separate file per primitive to avoid the video concatenation timestamp failure.
  video_files_size_in_mb: 0.000001

# Hardware parameters used if backend == "real"
hardware:
  port: "/dev/ttyACM0"
  calibration_id: "my_follower"
  read_timeout_margin_ms: 5.0
