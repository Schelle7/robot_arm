defaults:
  - _self_
  - experiment: baseline_cpu

model_path: "models/so101/scene.xml"
max_seconds: 10

# Camera resolution
camera:
  height: 480
  width: 640
  jpeg_quality: 90

# Control frequencies in Hz
frequencies:
  high_level: 5   # VLA inference and camera recording rate
  low_level: 200   # PID/MuJoCo physics stepping rate

# Safety constraints
safety:
  max_position_radians: 3.10
  min_position_radians: -3.10
  violation_penalty_factor: 10.0
  
# Trajectory parameters
trajectory_length: 50
trajectory_dim: 7
pose_distance_weights: [1.0, 1.0, 1.0, 0.5, 0.5, 0.5, 1.0]

# Training parameters for the low-level SAC controller
training:
  num_episodes: 1000
  parallel_envs: 20
  learning_rate: 0.0003
  buffer_size: 1000000
  learning_starts: 10000
  batch_size: 256
  tau: 0.005
  train_freq: 1
  gradient_steps: 1
  save_freq: 1000

  # Waypoint generation
  lift_height: 0.15
  gripper_open: 1.0
  gripper_closed: 0.0
  waypoint_speed: 0.005
