defaults:
  - rollout
  - _self_

arm_type: sim

runtime:
  draw_waypoints: false
  draw_tcp: false
  record_sim_state: true

control:
  initial_joints:
    mode: fixed
    positions_radians:
      shoulder_pan: 0.00153
      shoulder_lift: 1.24973
      elbow_flex: -0.32989
      wrist_flex: -1.00807
      wrist_roll: 2.11511
      gripper: 0.68389

# Match rollout_real's fixed target so sim and hardware attempt the same task.
waypoint:
  primitive_probabilities:
    pick_and_place: 0.0
    relative_move: 0.0
    random_waypoint: 1.0
  random_pose:
    shoulder_distance_meters: [0.32, 0.32]
    base_rotation_degrees: [15.0, 15.0]
    height_meters: [0.30, 0.30]
    pointing_axis_tilt_degrees: [30.0, 30.0]
    pointing_axis_rotation_degrees: [0.0, 0.0]
    gripper_radians: [0.0, 0.0]
