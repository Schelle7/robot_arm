# Read off the arm into outputs/characterize_gripper/2026-08-31/17-47-08/servo_configuration.json,
# except where marked. lerobot's SO101Follower.configure() rewrites several of these on every
# connect, so they are the servo's settings rather than ours to choose.
ticks_per_revolution: 4096
full_scale_duty: 1000
dead_zone_ticks: 1
min_startup_duty: 16

# Max_Torque_Limit on the servo, but its units are duty rather than torque.
max_duty:
  shoulder_pan: 1000
  shoulder_lift: 1000
  elbow_flex: 1000
  wrist_flex: 1000
  wrist_roll: 1000
  gripper: 500

# DERIVED, not read: the gripper held 40 ticks of error against an object and reported 184 duty.
duty_per_tick: 4.6

# DERIVED, not read: 19 kg-cm at 7.4 V, scaled to the 5.2 V measured on the rail.
stall_torque_newton_meters: 1.31
nominal_voltage_volts: 5.2

# ESTIMATED, not measured: ~0.22 s/60 deg at 7.4 V scaled to 5.2 V, biased low for gearbox friction
# in the 1/345 train. Only matters while a joint is moving quickly; it vanishes at stall.
no_load_speed_radians_per_second: 3.3

physics_randomization:
  damping: [0.04, 0.15]
  frictionloss: [0.015, 0.06]
  armature: [0.008, 0.03]
  braking_multiplier: [0.25, 1.0]
  motor_strength_multiplier: [0.8, 1.1]
  # Empirical fit to 2026-09-25/10-56-07; coefficients predict reported current, not calibrated motor constants.
  supply:
    source_voltage_volts: [5.1, 5.3]
    voltage_drop_volts_per_amp: [0.20, 0.25]
    current_scale_amps_per_volt:
      shoulder_pan: [0.247423, 0.247423]
      shoulder_lift: [0.208028, 0.208028]
      elbow_flex: [0.219108, 0.219108]
      wrist_flex: [0.186551, 0.186551]
      wrist_roll: [0.174129, 0.174129]
      gripper: [0.089634, 0.089634]
    back_emf_volts_per_radian_per_second:
      shoulder_pan: [0.875, 0.875]
      shoulder_lift: [0.750, 0.750]
      elbow_flex: [0.900, 0.900]
      wrist_flex: [0.925, 0.925]
      wrist_roll: [0.850, 0.850]
      gripper: [0.950, 0.950]
  added_weight:
    # Relative to the scene box so the training load follows changes to its mass; [0, 0] disables it.
    box_mass_fraction: [0.0, 2.0]
