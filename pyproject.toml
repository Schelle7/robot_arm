[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "robot_arm"
version = "0.1.0"
description = "Personal control code and experiments for an SO-101 follower arm using LeRobot."
requires-python = "==3.12.13"
dependencies = [
    "gdown==6.0.0",
    "lerobot[feetech, smolvla]==0.5.1",
    "pytest==9.1.1",
    "mujoco==3.10.0",
    "numpy==2.2.6",
    "hydra-core==1.3.4",
    "torch==2.10.0",
    "tensorboard==2.21.0",
    "tqdm==4.68.3",
    "scipy==1.18.0",
    "jax[cuda12]==0.11.1",
    "optax==0.2.8",
    "nvidia-ml-py==13.610.43",
    "black==26.5.1",
    "ruff==0.15.22"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"robot_arm.replay" = ["index.html"]

[tool.black]
line-length = 175
target-version = ["py312"]

[tool.ruff]
line-length = 175

[tool.pytest.ini_options]
pythonpath = ["."]
