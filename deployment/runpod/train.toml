api_url = "https://rest.runpod.io/v1"
credentials_file = "~/.config/runpod/env"
ssh_identity_file = "~/.ssh/id_ed25519"
ssh_public_key_file = "~/.ssh/id_ed25519.pub"
local_run_dir = "outputs/runpod/training"
request_timeout_seconds = 30
startup_timeout_seconds = 900
poll_seconds = 10

[pod]
name = "robot-arm-dagger"
computeType = "GPU"
cloudType = "SECURE"
imageName = "runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404"
gpuTypeIds = ["NVIDIA GeForce RTX 4090", "NVIDIA L40", "NVIDIA GeForce RTX 5090", "NVIDIA L40S"]
gpuTypePriority = "custom"
gpuCount = 1
dataCenterIds = ["EU-RO-1"]
dataCenterPriority = "custom"
networkVolumeId = "xhg1amwfrs"
volumeMountPath = "/workspace"
volumeInGb = 0
containerDiskInGb = 80
interruptible = false
ports = ["22/tcp"]
supportPublicIp = true

[training]
archive = "/workspace/preparation/20260914T150904313326Z/environment.tar.gz"
local_root = "/opt/robot-arm-training"
data_root = "/opt/robot-arm-training/data"
persistent_root = "/workspace/training"
repository_url = "https://github.com/Schelle7/robot_arm.git"
joint_policy = "artifacts/joint_policy/checkpoints/jax_sac_final_1000208.pkl"
overrides = []

[environment]
HF_HOME = "/workspace/.cache/huggingface"
HF_HUB_CACHE = "/workspace/.cache/huggingface/hub"
HF_HUB_OFFLINE = "1"
TRANSFORMERS_OFFLINE = "1"
MUJOCO_GL = "egl"
PYOPENGL_PLATFORM = "egl"
NVIDIA_DRIVER_CAPABILITIES = "compute,utility,graphics"
PYTHONUNBUFFERED = "1"
